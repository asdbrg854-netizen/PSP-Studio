name: PSP Studio Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Find and extract PSP Studio ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted build-project
          mkdir -p extracted build-project

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. build-project/

          ls -la build-project

      - name: Fetch XDelta3
        working-directory: build-project
        run: |
          set -e

          mkdir -p native

          if [ ! -d native/xdelta3-upstream ]; then
            git clone --depth 1 --branch v3.2.0 \
              https://github.com/jmacd/xdelta.git \
              native/xdelta3-upstream
          fi

      - name: Verify Java and Gradle
        working-directory: build-project
        run: |
          java -version
          gradle --version

      - name: Run tests
        working-directory: build-project
        run: |
          gradle test --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: build-project
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        working-directory: build-project
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Studio-v1-release
          path: build-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
